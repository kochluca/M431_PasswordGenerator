<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Passwortgenerator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, #25345a 0, transparent 55%),
          #111827;
      }

      main {
        width: min(100%, 480px);
        padding: 36px;
        border: 1px solid #374151;
        border-radius: 20px;
        background: rgb(31 41 55 / 92%);
        box-shadow: 0 24px 70px rgb(0 0 0 / 30%);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #a5b4fc;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 6vw, 2.2rem);
      }

      .intro {
        margin: 10px 0 28px;
        color: #cbd5e1;
        line-height: 1.5;
      }

      .password-box {
        display: flex;
        min-height: 64px;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid #4b5563;
        border-radius: 12px;
        background: #111827;
      }

      #password {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
        color: #e0e7ff;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 1rem;
        line-height: 1.5;
      }

      button {
        border: 0;
        border-radius: 9px;
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition:
          background-color 150ms ease,
          transform 150ms ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #c7d2fe;
        outline-offset: 3px;
      }

      .copy-button {
        flex: 0 0 auto;
        padding: 9px 12px;
        background: #374151;
      }

      .copy-button:hover {
        background: #4b5563;
      }

      .length-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 26px 0 12px;
        font-weight: 600;
      }

      #length-value {
        color: #c7d2fe;
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        margin: 0;
        accent-color: #818cf8;
        cursor: pointer;
      }

      .option-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
        color: #e5e7eb;
        cursor: pointer;
      }

      .option-row input {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: #818cf8;
        cursor: pointer;
      }

      .range-limits {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        color: #9ca3af;
        font-size: 0.8rem;
      }

      .generate-button {
        width: 100%;
        margin-top: 28px;
        padding: 13px 18px;
        background: #6366f1;
      }

      .generate-button:hover {
        background: #4f46e5;
      }

      #status {
        min-height: 1.5em;
        margin: 14px 0 0;
        color: #a5b4fc;
        font-size: 0.9rem;
        text-align: center;
      }

      @media (max-width: 420px) {
        main {
          padding: 26px 20px;
        }

        .password-box {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Sicher &amp; zufällig</p>
      <h1>Passwortgenerator</h1>
      <p class="intro">
        Erstelle ein starkes Passwort aus Groß- und Kleinbuchstaben. Zahlen und
        Sonderzeichen kannst du optional hinzufügen.
      </p>

      <div class="password-box">
        <output
          id="password"
          aria-label="Generiertes Passwort"
          aria-live="polite"
        ></output>
        <button class="copy-button" id="copy-button" type="button">
          Kopieren
        </button>
      </div>

      <div class="length-row">
        <label for="length">Passwortlänge</label>
        <span><output id="length-value">16</output> Zeichen</span>
      </div>
      <input id="length" type="range" min="5" max="25" value="16" />
      <div class="range-limits" aria-hidden="true">
        <span>5</span>
        <span>25</span>
      </div>

      <label class="option-row" for="include-symbols">
        <input id="include-symbols" type="checkbox" checked />
        Sonderzeichen verwenden
      </label>

      <label class="option-row" for="include-numbers">
        <input id="include-numbers" type="checkbox" checked />
        Zahlen verwenden
      </label>

      <button class="generate-button" id="generate-button" type="button">
        Neues Passwort erstellen
      </button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const requiredCharacterGroups = [
        "abcdefghijklmnopqrstuvwxyz",
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      ];
      const numberCharacters = "0123456789";
      const symbolCharacters = "!#$%&()*+,-./:;<=>?@[]^_{|}~";
      const passwordOutput = document.querySelector("#password");
      const lengthSlider = document.querySelector("#length");
      const lengthValue = document.querySelector("#length-value");
      const symbolsCheckbox = document.querySelector("#include-symbols");
      const numbersCheckbox = document.querySelector("#include-numbers");
      const status = document.querySelector("#status");

      function secureRandomIndex(max) {
        const range = 0x100000000;
        const limit = Math.floor(range / max) * max;
        const randomValue = new Uint32Array(1);

        do {
          crypto.getRandomValues(randomValue);
        } while (randomValue[0] >= limit);

        return randomValue[0] % max;
      }

      function generatePassword(length) {
        const characterGroups = [...requiredCharacterGroups];
        if (symbolsCheckbox.checked) {
          characterGroups.push(symbolCharacters);
        }
        if (numbersCheckbox.checked) {
          characterGroups.push(numberCharacters);
        }

        const allCharacters = characterGroups.join("");
        const characters = characterGroups.map(
          (group) => group[secureRandomIndex(group.length)],
        );

        while (characters.length < length) {
          characters.push(
            allCharacters[secureRandomIndex(allCharacters.length)],
          );
        }

        for (let index = characters.length - 1; index > 0; index -= 1) {
          const swapIndex = secureRandomIndex(index + 1);
          [characters[index], characters[swapIndex]] = [
            characters[swapIndex],
            characters[index],
          ];
        }

        return characters.join("");
      }

      function updatePassword() {
        const length = Number(lengthSlider.value);
        passwordOutput.textContent = generatePassword(length);
        status.textContent = "";
      }

      lengthSlider.addEventListener("input", () => {
        lengthValue.textContent = lengthSlider.value;
        updatePassword();
      });

      symbolsCheckbox.addEventListener("change", updatePassword);
      numbersCheckbox.addEventListener("change", updatePassword);
      document
        .querySelector("#generate-button")
        .addEventListener("click", updatePassword);

      document
        .querySelector("#copy-button")
        .addEventListener("click", async () => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(passwordOutput.textContent);
            } else {
              const temporaryInput = document.createElement("textarea");
              temporaryInput.value = passwordOutput.textContent;
              temporaryInput.setAttribute("readonly", "");
              temporaryInput.style.position = "fixed";
              temporaryInput.style.opacity = "0";
              document.body.append(temporaryInput);
              temporaryInput.select();
              const copied = document.execCommand("copy");
              temporaryInput.remove();

              if (!copied) {
                throw new Error(
                  "Kopieren wird von diesem Browser nicht unterstützt.",
                );
              }
            }

            status.textContent = "Passwort wurde kopiert.";
          } catch (error) {
            status.textContent =
              "Kopieren fehlgeschlagen. Bitte markiere das Passwort und kopiere es manuell.";
          }
        });

      updatePassword();
    </script>
  </body>
</html>
